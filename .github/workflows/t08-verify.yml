name: T08 passkey-only verification
on:
  push:
    branches: [assignment-8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-browser-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: t08_runner
          POSTGRES_PASSWORD: ci-only-not-real
          POSTGRES_DB: t08_passkey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t08_runner -d t08_passkey_test"
          --health-interval 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://t08_runner:ci-only-not-real@127.0.0.1:5432/t08_passkey_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependencies and prepare dependency lock
        run: |
          if test -f package-lock.json; then npm ci; else npm install --package-lock-only && npm ci; fi
          node -e 'console.log("T08_LOCK_START"); console.log(JSON.stringify(require("./package-lock.json"))); console.log("T08_LOCK_END");'
      - name: Security audit
        run: npm audit --omit=dev
      - name: Source and configuration tests
        run: npm test
      - name: Browser availability
        run: |
          if ! test -x /usr/bin/google-chrome; then npx playwright-core install chromium; fi
      - name: Actual virtual WebAuthn end-to-end with disposable PostgreSQL
        run: node tests/t08-browser-check.cjs
      - name: Save sanitized evidence and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t08-webauthn-test-evidence
          path: test-results/t08/
          if-no-files-found: warn
          retention-days: 14
