name: BR-A public visitor smoke and screenshot
on:
  push:
    branches: [final-br-a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-no-login:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check requested changes and untouched original design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('portfolio/index.html').read_text()
          css=Path('portfolio/style.css').read_text()
          assert '<aside class="hero-box"><span>MY WORK PRINCIPLE</span>' in p
          assert '<a class="logo" href="#top">김태양 / 포트폴리오</a>' in p
          assert '통신 현장에서 배운 조율과 개발·보안 실습에서 익힌 검증 습관을 연결합니다' in p
          assert '김태양<span class="accent">.' in p
          assert '<section id="story"' in p and '<section id="approach"' in p
          assert '<details id="evidence"' in p
          story=p.split('<article class="prose">',1)[1].split('</article>',1)[0]
          assert story.count('<p>')==3
          strength=p.split('<section id="approach"',1)[1].split('</section>',1)[0]
          assert strength.count('<article>')==3
          assert all('class="eyebrow section-step">'+n+'</span>' in p for n in ('01','02','03','04'))
          assert '01 / 소개' not in p and '03 / 대표 프로젝트' not in p
          assert p.count('class="featured-work"')==2
          for href,label in (
              ('./projects/protective-dns/index.html','Protective DNS 자세히 보기'),
              ('./projects/clean4u/index.html','Clean4U 자세히 보기'),
              ('./research.html','공식기관 URL 판정 방식 비교 자세히 보기'),
              ('./brb/index.html','URL 주소 해부실 자세히 보기')):
              assert 'href="'+href+'">'+label+' ↗</a>' in p,(href,label)
          resume=Path('portfolio/resume.html').read_text()
          resume_css=Path('portfolio/resume.css').read_text()
          for phrase in ('김태양','Protective DNS','Clean4U','로그 한눈에','ZTNA·XDR 공동방어전',
                         '통신 회선 설계·현장 관리','씨케이네트워크','㈜제니스네트웍',
                         '2024.08','동명대학교 · 경영정보학과','코리아IT아카데미','코리아AI아카데미',
                         'Java, Spring Boot','Supabase Auth','경력증빙과 최종 대조'):
              assert phrase in resume,phrase
          assert 'href="./resume.css?v=20261111-r4"' in resume
          assert '<a class="resume-brand" href="./index.html">김태양 / 포트폴리오</a>' in resume
          assert '@media(max-width:720px)' in resume_css
          assert '@media print' in resume_css
          assert resume.count('class="resume-project"')==2
          assert '010-' not in resume and 'gmail.com' not in resume
          assert len(resume)>6500 and len(resume_css)>6000
          assert '<div class="works-heading">' in p
          assert '<div class="secondary-grid">' in p
          assert 'class="hero-intro"' in p and p.count('class="hero-sentence"')==2
          assert 'class="evidence-label"' in p and 'class="evidence-toggle"' in p
          assert p.index('<h3>Protective DNS</h3>') < p.index('<h3>Clean4U</h3>')
          assert '가짜 피해구제·기관 사칭 사이트의 위험' in p
          assert '세탁소의 운영 업무를 한곳에서 관리하는 서비스' in p
          assert '함께 확인할 수 있는 다른 작업' not in p
          for l in ('projects/clean4u/index.html','projects/protective-dns/index.html','brb/index.html','research.html','resume.html','statement.html','experience.html'):
              assert './'+l in p,l
              assert (Path('portfolio')/l).is_file()
          assert '경험을 지원 서류로 연결합니다.' not in p
          assert '공개 GitHub 이슈로 문의하기' in p
          assert 'href="./style.css?v=20261111-aesthetic7"' in p
          assert 'box-shadow:14px 16px 0 #e3eee7' in css
          assert "font-family:'Noto Sans KR'" in css
          stats=json.loads(Path('portfolio/data/summary.json').read_text())['stats']
          assert [stats[k] for k in ('recorded_days','open_days','close_days','records_total','done_days','partly_done_days','not_done_days')]==[61,61,60,121,40,11,9]
          assert stats['program_weeks']==13 and stats['iso_weeks']==14
          assert 'data-field="recorded_days">61' in p
          assert '2026.08.11~11.10' in p
          assert '2026.08.11~11.10' in Path('portfolio/statement.html').read_text()
          assert 'grid-template-columns:repeat(4,minmax(0,1fr))' in css
          assert 'aria-current' in Path('portfolio/main.js').read_text()
          assert '동명대학교 · 경영정보학과' in resume and '씨케이네트워크' in resume
          assert '010-' not in resume and 'gmail.com' not in resume and '재반로' not in resume
          print('PASS: original hero/ornament/documents retained, targeted feedback only, featured capstone and Clean4U')
          PY
      - name: Check public HTTPS and all key links
        run: |
          set -euo pipefail
          BASE=https://bra-kimtaeyang-portfolio.onrender.com
          mkdir -p test-results/bra
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 20 "$BASE/index.html?rev=$GITHUB_SHA" -o test-results/bra/index.html && curl -fsSL --max-time 20 "$BASE/style.css?rev=$GITHUB_SHA" -o test-results/bra/style.css; then
              if grep -q 'class="hero-box"' test-results/bra/index.html && grep -q 'id="approach"' test-results/bra/index.html && grep -q 'class="featured-work"' test-results/bra/index.html && grep -q 'review improvements' test-results/bra/style.css && grep -q 'flex-direction:column' test-results/bra/style.css && grep -q 'style.css?v=20261111-aesthetic7' test-results/bra/index.html && grep -q 'Clean4U 자세히 보기' test-results/bra/index.html;then READY=1;break;fi
            fi
            sleep 6
          done
          if [ "$READY" != "1" ];then echo 'FAIL: targeted redesign is not publicly deployed';exit 1;fi
          for p in resume.html statement.html experience.html research.html brb/index.html projects/clean4u/index.html projects/protective-dns/index.html data/summary.json;do
            curl -fsSL --max-time 20 "$BASE/$p" -o /dev/null
          done
          curl -fsSL --max-time 20 "$BASE/resume.html?rev=$GITHUB_SHA" -o test-results/bra/resume.html
          curl -fsSL --max-time 20 "$BASE/resume.css?rev=$GITHUB_SHA" -o test-results/bra/resume.css
          grep -q 'class="resume-main-grid"' test-results/bra/resume.html
          grep -q 'resume.css?v=20261111-r4' test-results/bra/resume.html
          grep -q 'Public resume page' test-results/bra/resume.css
          grep -q 'Tablet readability' test-results/bra/resume.css
          grep -q 'Source-verified education' test-results/bra/resume.css
          echo "PASS: revised portfolio, expanded resume and all supporting pages available anonymously"
      - name: Inspect desktop and mobile layout in Chrome
        run: |
          python3 -m pip install -q selenium
          python3 - <<'PY'
          import os,shutil,json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          options=Options()
          options.binary_location=shutil.which('google-chrome') or shutil.which('chromium')
          for flag in ('--headless=new','--disable-gpu','--no-sandbox','--disable-dev-shm-usage'):
              options.add_argument(flag)
          driver=webdriver.Chrome(options=options)
          try:
              for width,height,label in ((1440,900,'desktop'),(390,844,'mobile')):
                  driver.set_window_size(width,height)
                  driver.get('https://bra-kimtaeyang-portfolio.onrender.com/?rev='+os.getenv('GITHUB_SHA',''))
                  WebDriverWait(driver,25).until(lambda d:d.execute_script('return document.fonts.status')=='loaded')
                  result=driver.execute_script("""
                     const title=document.querySelector('.hero h2'),lh=parseFloat(getComputedStyle(title).lineHeight);
                     const heroLine1=document.querySelector('.hero-sentence'),heroLine2=document.querySelectorAll('.hero-sentence')[1];
                     const heading=document.querySelector('.works-heading').getBoundingClientRect(),
                           main=document.querySelector('.featured-works').getBoundingClientRect(),
                           more=document.querySelector('.secondary-work').getBoundingClientRect(),
                           cards=[...document.querySelectorAll('.featured-work')].map(e=>e.getBoundingClientRect());
                     const label=document.querySelector('.evidence-label').getBoundingClientRect(),
                           plus=document.querySelector('.evidence-toggle').getBoundingClientRect();
                     return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                       taglineLines:Math.round(title.getBoundingClientRect().height/lh),
                       ornament:getComputedStyle(document.querySelector('.hero-box')).display,
                       sentenceSeparation:Math.round(heroLine2.getBoundingClientRect().top-heroLine1.getBoundingClientRect().top),
                       sentence1Height:Math.round(heroLine1.getBoundingClientRect().height),
                       projectGeometry:{headingBottom:Math.round(heading.bottom),headingTextBottom:Math.round(document.querySelector('.works-heading .section-desc').getBoundingClientRect().bottom),mainTop:Math.round(main.top),mainBottom:Math.round(main.bottom),moreTop:Math.round(more.top),cards:cards.map(x=>({x:Math.round(x.x),y:Math.round(x.y),width:Math.round(x.width)}))},
                       plusGap:Math.round(plus.left-label.right),
                       projectHeight:Math.round(document.querySelector('.works-section').getBoundingClientRect().height)};
                  """)
                  print('RESULT_'+label+': '+json.dumps(result,ensure_ascii=False))
                  assert result['scrollWidth']<=result['width']+3,'Horizontal scroll: '+label
                  assert result['sentenceSeparation']>15,'Hero sentences not on separate lines'
                  assert 0<=result['plusGap']<=13,'Plus is not beside ritual label: '+str(result['plusGap'])
                  g=result['projectGeometry']
                  assert g['mainTop']>=g['headingTextBottom']+8,'Projects heading text too close to featured cards: '+str(g)
                  assert g['moreTop']>=g['mainBottom']+5,'Secondary works not placed underneath featured works: '+str(g)
                  if label=='desktop':
                      assert result['taglineLines']==1,'Hero title still wraps'
                      assert result['ornament']!='none','Original ornament missing'
                      assert abs(g['cards'][0]['y']-g['cards'][1]['y'])<=2,'Two featured projects are not side by side'
                      assert g['cards'][0]['width']>=350 and g['cards'][1]['width']>=350,'Featured cards are squeezed'
                      assert result['projectHeight']<=height-72+3,'Project chapter still taller than viewport: '+str(result['projectHeight'])
                  else:
                      assert g['cards'][1]['y']>g['cards'][0]['y'],'Mobile project cards should stack'
                  if label=='mobile':
                      from selenium.webdriver.common.by import By
                      links=driver.find_elements(By.CSS_SELECTOR,'.nav nav a')
                      menu=[{'text':x.text,'displayed':x.is_displayed(),'height':int(x.rect['height'])} for x in links]
                      print('MOBILE_MENU:'+json.dumps(menu,ensure_ascii=False))
                      assert len(menu)==4 and all(x['displayed'] and x['height']>=40 for x in menu),menu
                      work=driver.find_element(By.CSS_SELECTOR,'.nav nav a[href="#works"]')
                      work.click()
                      assert driver.execute_script('return location.hash')=='#works'
                      assert work.get_attribute('aria-current')=='location','Active nav state missing'
                      details=driver.find_element(By.ID,'evidence')
                      details.find_element(By.CSS_SELECTOR,'summary').click()
                      assert details.get_attribute('open') is not None,'Evidence disclosure did not open'
                      record=driver.execute_script("return [...document.querySelectorAll('#evidence [data-field]')].map(x=>Number(x.textContent))")
                      print('RITUAL_RENDERED:'+json.dumps(record))
                      assert record==[61,60,40,61],record
                      details.find_element(By.CSS_SELECTOR,'summary').click()
                      assert details.get_attribute('open') is None,'Evidence disclosure did not close'
                  driver.save_screenshot('test-results/bra/'+label+'-hero.png')
                  for anchor in (['story','approach','works'] if label=='desktop' else ['works']):
                      driver.execute_script("document.getElementById(arguments[0]).scrollIntoView({behavior:'instant',block:'start'})",anchor)
                      if anchor in ('approach','works'):
                          anchors=driver.execute_script("""
                             const id=arguments[0],section=document.getElementById(id),
                                   label=section.querySelector('.section-step').getBoundingClientRect(),
                                   last=id==='works'?section.querySelector('.secondary-grid').getBoundingClientRect():section.querySelector('.evidence-details').getBoundingClientRect();
                             return {labelTop:Math.round(label.top),lastBottom:Math.round(last.bottom),height:innerHeight}
                          """,anchor)
                          print('ANCHOR_'+label+'_'+anchor+': '+json.dumps(anchors))
                          assert anchors['labelTop']>=63,'Sticky header hides chapter number: '+str(anchors)
                          if label=='desktop':
                              assert anchors['lastBottom']<=anchors['height']+6,'Chapter content runs off first screen: '+str(anchors)
                      driver.save_screenshot('test-results/bra/'+label+'-'+anchor+'.png')
              for width,height,label in ((1440,900,'desktop'),(390,844,'mobile'),(768,900,'tablet')):
                  driver.set_window_size(width,height)
                  driver.get('https://bra-kimtaeyang-portfolio.onrender.com/resume.html?rev='+os.getenv('GITHUB_SHA',''))
                  WebDriverWait(driver,25).until(lambda d:d.execute_script('return document.fonts.status')=='loaded')
                  layout=driver.execute_script("""
                     const main=document.querySelector('.resume-primary-column').getBoundingClientRect(),
                           side=document.querySelector('.resume-side-column').getBoundingClientRect(),
                           hero=document.querySelector('.resume-intro').getBoundingClientRect(),
                           focus=document.querySelector('.resume-focus').getBoundingClientRect();
                     return {viewport:innerWidth,fullWidth:document.documentElement.scrollWidth,
                            mainX:Math.round(main.x),sideX:Math.round(side.x),
                            mainWidth:Math.round(main.width),sideWidth:Math.round(side.width),
                            heroHeight:Math.round(hero.height),focusWidth:Math.round(focus.width),
                            projects:document.querySelectorAll('.resume-project').length,
                            skills:document.querySelectorAll('.resume-skills div').length};
                  """)
                  print('RESUME_'+label+': '+json.dumps(layout,ensure_ascii=False))
                  assert layout['fullWidth']<=layout['viewport']+2,'Resume horizontal overflow: '+label
                  assert layout['mainWidth']>=240,'Resume main column squeezed: '+str(layout)
                  assert layout['projects']==2 and layout['skills']==4
                  assert len(driver.find_elements(By.CSS_SELECTOR,'.resume-employers>div'))==2,'Employer history missing'
                  assert driver.find_elements(By.CSS_SELECTOR,'.resume-education-history'),'Education card missing'
                  if label=='mobile':
                      menu=driver.find_elements(By.CSS_SELECTOR,'.resume-header nav a')
                      assert len(menu)==3 and all(x.is_displayed() and x.rect['height']>=40 for x in menu),'Resume touch targets too small'
                  if label=='desktop':
                      assert layout['sideX']>layout['mainX']+layout['mainWidth']-5,'Resume side column not next to main'
                  else:
                      assert layout['sideX']<=layout['mainX']+40,'Resume columns not stacked'
                  driver.save_screenshot('test-results/bra/resume-'+label+'-top.png')
                  driver.execute_script("document.getElementById('resume-projects').scrollIntoView({behavior:'instant',block:'start'})")
                  driver.save_screenshot('test-results/bra/resume-'+label+'-projects.png')
              print('PASS: homepage, four uniform project links, expanded resume and responsive desktop/mobile/tablet layouts')
          finally:
              driver.quit()
          PY
      - name: Upload evidence without private ritual source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bra-public-visitor-evidence
          path: test-results/bra
          if-no-files-found: warn
          retention-days: 14
