name: BR-A public visitor smoke and screenshot
on:
  push:
    branches: [final-br-a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-no-login:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Verify source content and preserve all local links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('portfolio/index.html').read_text(encoding='utf-8')
          css=Path('portfolio/style.css').read_text(encoding='utf-8')
          for key in ('김태양','막힌 문제를 기록하고 검증하며','id="story"','id="approach"','id="works"','id="documents"','id="evidence"'):
              assert key in html,key
          story=html.split('<div class="story-content">',1)[1].split('</div>',1)[0]
          assert story.count('<p>')==3
          assert html.count('class="strength-card"')==3
          assert html.count('class="featured-card"')==2
          assert html.index('<h3>Protective DNS</h3>') < html.index('<h3>Clean4U</h3>')
          assert '함께 확인할 수 있는 다른 작업' not in html
          for link in ('projects/clean4u/index.html','projects/protective-dns/index.html','brb/index.html','research.html','statement.html','resume.html','experience.html'):
              assert './'+link in html,link
              assert (Path('portfolio')/link).exists(),link
          assert '<details id="evidence"' in html and 'data-field="open_days"' in html
          assert '2026.08.11~11.05' in html
          assert '.hero-message{white-space:nowrap}' in css
          assert '@media(max-width:760px)' in css
          assert 'Desktop fit refinement' in css
          assert 'style.css?v=20261111-compact2' in html
          stats=json.loads(Path('portfolio/data/summary.json').read_text())['stats']
          assert [stats[x] for x in ('open_days','close_days','iso_weeks','done_days','partly_done_days','not_done_days')]==[58,58,13,39,11,8]
          print('PASS: 3-paragraph introduction, 3 grounded examples, featured order, links, and dated sourced statistics')
          PY
      - name: Test updated public site and supporting pages without login
        run: |
          set -euo pipefail
          BASE="https://bra-kimtaeyang-portfolio.onrender.com"
          mkdir -p test-results/bra
          ok=0
          for attempt in $(seq 1 28); do
            if curl -fsSL --max-time 20 "$BASE/index.html?sha=$GITHUB_SHA" -o test-results/bra/index.html && curl -fsSL --max-time 20 "$BASE/style.css?sha=$GITHUB_SHA" -o test-results/bra/style.css; then
              if grep -q 'id="approach"' test-results/bra/index.html && grep -q 'id="evidence"' test-results/bra/index.html && grep -q 'class="featured-grid"' test-results/bra/index.html && grep -q 'white-space:nowrap' test-results/bra/style.css; then ok=1;break;fi
            fi
            sleep 8
          done
          if [ "$ok" != 1 ]; then echo 'FAIL: updated public site is not deployed';exit 1;fi
          for path in resume.html statement.html experience.html research.html brb/index.html projects/clean4u/index.html projects/protective-dns/index.html data/summary.json; do
            curl -fsSL --max-time 20 "$BASE/$path" -o /dev/null
          done
          echo 'PASS: anonymous access to updated portfolio and 8 related files'
      - name: Check mobile and desktop layout in real Chrome
        run: |
          python3 -m pip install -q selenium
          python3 - <<'PY'
          import os,shutil,json
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          options=Options()
          options.binary_location=shutil.which('google-chrome') or shutil.which('chromium')
          for flag in ('--headless=new','--disable-gpu','--no-sandbox','--disable-dev-shm-usage'):
              options.add_argument(flag)
          browser=webdriver.Chrome(options=options)
          try:
              for width,height,label in ((1440,900,'desktop'),(390,844,'mobile')):
                  browser.set_window_size(width,height)
                  browser.get('https://bra-kimtaeyang-portfolio.onrender.com/index.html?check='+os.environ.get('GITHUB_SHA',''))
                  WebDriverWait(browser,25).until(lambda x:x.execute_script('return document.fonts.status')=='loaded')
                  report=browser.execute_script("""
                    const t=document.querySelector('.hero-message'),l=parseFloat(getComputedStyle(t).lineHeight);
                    return {viewport:window.innerWidth,fullWidth:document.documentElement.scrollWidth,
                      heroLines:Math.round(t.getBoundingClientRect().height/l),
                      sections:['top','story','approach','works','documents'].map(id=>({id,height:Math.round(document.getElementById(id).getBoundingClientRect().height)})),
                      evidenceOpen:document.getElementById('evidence').open};
                  """)
                  print('LAYOUT_'+label+': '+json.dumps(report,ensure_ascii=False))
                  assert report['fullWidth']<=report['viewport']+2,'horizontal overflow: '+label
                  assert report['evidenceOpen'] is False
                  if label=='desktop':
                      assert report['heroLines']==1,'slogan is not on one desktop line'
                      padding=browser.execute_script("return [getComputedStyle(document.querySelector('.approach')).paddingTop,getComputedStyle(document.querySelector('.projects')).paddingTop]")
                      assert padding==['43px','48px'],'New compact CSS not loaded: '+str(padding)
                      for item in report['sections']:
                          assert item['height']<=1050, 'section too tall: '+str(item)
                  browser.save_screenshot('test-results/bra/'+label+'-hero.png')
                  for section in (['story','approach','works'] if label=='desktop' else ['works']):
                      browser.execute_script("document.getElementById(arguments[0]).scrollIntoView({behavior:'instant',block:'start'})",section)
                      browser.save_screenshot('test-results/bra/'+label+'-'+section+'.png')
              print('PASS: 1-line desktop hero, desktop section height, responsive mobile without overflow')
          finally:
              browser.quit()
          PY
      - name: Upload evidence without private ritual source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bra-public-visitor-evidence
          path: test-results/bra
          if-no-files-found: warn
          retention-days: 14
