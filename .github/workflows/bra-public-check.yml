name: BR-A public visitor smoke and screenshot
on:
  push:
    branches: [final-br-a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-no-login:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check requested changes and untouched original design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('portfolio/index.html').read_text()
          css=Path('portfolio/style.css').read_text()
          assert '<aside class="hero-box"><span>MY WORK PRINCIPLE</span>' in p
          assert '통신 현장에서 배운 조율과 개발·보안 실습에서 익힌 검증 습관을 연결합니다' in p
          assert '김태양<span class="accent">.' in p
          assert '<section id="story"' in p and '<section id="approach"' in p
          assert '<details id="evidence"' in p
          story=p.split('<article class="prose">',1)[1].split('</article>',1)[0]
          assert story.count('<p>')==3
          strength=p.split('<section id="approach"',1)[1].split('</section>',1)[0]
          assert strength.count('<article>')==3
          assert all('class="eyebrow section-step">'+n+'</span>' in p for n in ('01','02','03','04'))
          assert '01 / 소개' not in p and '03 / 대표 프로젝트' not in p
          assert p.count('class="featured-work"')==2
          assert '<div class="works-heading">' in p
          assert '<div class="secondary-grid">' in p
          assert 'class="hero-intro"' in p and p.count('class="hero-sentence"')==2
          assert 'class="evidence-label"' in p and 'class="evidence-toggle"' in p
          assert p.index('<h3>Protective DNS</h3>') < p.index('<h3>Clean4U</h3>')
          assert '가짜 피해구제·기관 사칭 사이트의 위험' in p
          assert '세탁소의 운영 업무를 한곳에서 관리하는 서비스' in p
          assert '함께 확인할 수 있는 다른 작업' not in p
          for l in ('projects/clean4u/index.html','projects/protective-dns/index.html','brb/index.html','research.html','resume.html','statement.html','experience.html'):
              assert './'+l in p,l
              assert (Path('portfolio')/l).is_file()
          assert '경험을 지원 서류로 연결합니다.' not in p
          assert '공개 GitHub 이슈로 문의하기' in p
          assert 'href="./style.css?v=20261111-review3"' in p
          assert 'box-shadow:14px 16px 0 #e3eee7' in css
          assert "font-family:'Noto Sans KR'" in css
          stats=json.loads(Path('portfolio/data/summary.json').read_text())['stats']
          assert [stats[k] for k in ('open_days','close_days','iso_weeks','done_days','partly_done_days','not_done_days')]==[58,58,13,39,11,8]
          print('PASS: original hero/ornament/documents retained, targeted feedback only, featured capstone and Clean4U')
          PY
      - name: Check public HTTPS and all key links
        run: |
          set -euo pipefail
          BASE=https://bra-kimtaeyang-portfolio.onrender.com
          mkdir -p test-results/bra
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 20 "$BASE/index.html?rev=$GITHUB_SHA" -o test-results/bra/index.html && curl -fsSL --max-time 20 "$BASE/style.css?rev=$GITHUB_SHA" -o test-results/bra/style.css; then
              if grep -q 'class="hero-box"' test-results/bra/index.html && grep -q 'id="approach"' test-results/bra/index.html && grep -q 'class="featured-work"' test-results/bra/index.html && grep -q 'review improvements' test-results/bra/style.css && grep -q 'flex-direction:column' test-results/bra/style.css && grep -q 'style.css?v=20261111-review3' test-results/bra/index.html;then READY=1;break;fi
            fi
            sleep 6
          done
          if [ "$READY" != "1" ];then echo 'FAIL: targeted redesign is not publicly deployed';exit 1;fi
          for p in resume.html statement.html experience.html research.html brb/index.html projects/clean4u/index.html projects/protective-dns/index.html data/summary.json;do
            curl -fsSL --max-time 20 "$BASE/$p" -o /dev/null
          done
          echo "PASS: new portfolio and supporting pages available anonymously"
      - name: Inspect desktop and mobile layout in Chrome
        run: |
          python3 -m pip install -q selenium
          python3 - <<'PY'
          import os,shutil,json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          options=Options()
          options.binary_location=shutil.which('google-chrome') or shutil.which('chromium')
          for flag in ('--headless=new','--disable-gpu','--no-sandbox','--disable-dev-shm-usage'):
              options.add_argument(flag)
          driver=webdriver.Chrome(options=options)
          try:
              for width,height,label in ((1440,900,'desktop'),(390,844,'mobile')):
                  driver.set_window_size(width,height)
                  driver.get('https://bra-kimtaeyang-portfolio.onrender.com/?rev='+os.getenv('GITHUB_SHA',''))
                  WebDriverWait(driver,25).until(lambda d:d.execute_script('return document.fonts.status')=='loaded')
                  result=driver.execute_script("""
                     const title=document.querySelector('.hero h2'),lh=parseFloat(getComputedStyle(title).lineHeight);
                     const heroLine1=document.querySelector('.hero-sentence'),heroLine2=document.querySelectorAll('.hero-sentence')[1];
                     const heading=document.querySelector('.works-heading').getBoundingClientRect(),
                           main=document.querySelector('.featured-works').getBoundingClientRect(),
                           more=document.querySelector('.secondary-work').getBoundingClientRect(),
                           cards=[...document.querySelectorAll('.featured-work')].map(e=>e.getBoundingClientRect());
                     const label=document.querySelector('.evidence-label').getBoundingClientRect(),
                           plus=document.querySelector('.evidence-toggle').getBoundingClientRect();
                     return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                       taglineLines:Math.round(title.getBoundingClientRect().height/lh),
                       ornament:getComputedStyle(document.querySelector('.hero-box')).display,
                       sentenceSeparation:Math.round(heroLine2.getBoundingClientRect().top-heroLine1.getBoundingClientRect().top),
                       sentence1Height:Math.round(heroLine1.getBoundingClientRect().height),
                       projectGeometry:{headingBottom:Math.round(heading.bottom),mainTop:Math.round(main.top),mainBottom:Math.round(main.bottom),moreTop:Math.round(more.top),cards:cards.map(x=>({x:Math.round(x.x),y:Math.round(x.y),width:Math.round(x.width)}))},
                       plusGap:Math.round(plus.left-label.right),
                       projectHeight:Math.round(document.querySelector('.works-section').getBoundingClientRect().height)};
                  """)
                  print('RESULT_'+label+': '+json.dumps(result,ensure_ascii=False))
                  assert result['scrollWidth']<=result['width']+3,'Horizontal scroll: '+label
                  assert result['sentenceSeparation']>15,'Hero sentences not on separate lines'
                  assert 0<=result['plusGap']<=13,'Plus is not beside ritual label: '+str(result['plusGap'])
                  g=result['projectGeometry']
                  assert g['mainTop']>=g['headingBottom']+5,'Projects heading and main cards overlap or flow horizontally: '+str(g)
                  assert g['moreTop']>=g['mainBottom']+5,'Secondary works not placed underneath featured works: '+str(g)
                  if label=='desktop':
                      assert result['taglineLines']==1,'Hero title still wraps'
                      assert result['ornament']!='none','Original ornament missing'
                      assert abs(g['cards'][0]['y']-g['cards'][1]['y'])<=2,'Two featured projects are not side by side'
                      assert g['cards'][0]['width']>=350 and g['cards'][1]['width']>=350,'Featured cards are squeezed'
                      assert result['projectHeight']<=height-72+3,'Project chapter still taller than viewport: '+str(result['projectHeight'])
                  else:
                      assert g['cards'][1]['y']>g['cards'][0]['y'],'Mobile project cards should stack'
                  driver.save_screenshot('test-results/bra/'+label+'-hero.png')
                  for anchor in (['story','approach','works'] if label=='desktop' else ['works']):
                      driver.execute_script("document.getElementById(arguments[0]).scrollIntoView({behavior:'instant',block:'start'})",anchor)
                      driver.save_screenshot('test-results/bra/'+label+'-'+anchor+'.png')
              print('PASS: ordered project heading, two featured cards, two secondary cards, adjacent plus, and no mobile overflow')
          finally:
              driver.quit()
          PY
      - name: Upload evidence without private ritual source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bra-public-visitor-evidence
          path: test-results/bra
          if-no-files-found: warn
          retention-days: 14
